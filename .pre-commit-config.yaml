# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# Install once:  .venv/Scripts/pre-commit.exe install -t pre-commit -t pre-push
default_stages: [pre-commit]
repos:

  # Project policy: UTF-8 without BOM + LF (CRLF + BOM for *.ps1) - see scripts/check_encoding.py
  - repo: local
    hooks:
      - id: check-encoding
        name: check encoding and line endings
        entry: python scripts/check_encoding.py
        language: python
        types: [text]
        stages: [pre-commit]
      - id: check-encoding-all
        name: check encoding and line endings (whole repository)
        entry: python scripts/check_encoding.py --all
        language: python
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: "v2.3.1"
    hooks:
      - id: mypy
        additional_dependencies:
          - types-cachetools==7.0.0.20260713
          - types-filelock==3.2.7
          - types-requests==2.33.0.20260906
          - types-tabulate==0.10.0.20260508
          - types-python-dateutil==2.9.0.20260807
          - scipy-stubs==1.17.1.5
          - SQLAlchemy==2.0.54
        # stages: [push]

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    # Ruff version.
    rev: 'v0.16.8'  # keep in sync with requirements-dev.txt
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: |
            (?x)^(
                tests/.*|
                .*\.svg|
                .*\.yml|
                .*\.json
            )$
      - id: mixed-line-ending
      - id: debug-statements
      - id: check-ast
      - id: trailing-whitespace
        exclude: |
          (?x)^(
                .*\.md
            )$

  - repo: https://github.com/stefmolin/exif-stripper
    rev: 1.2.0
    hooks:
      - id: strip-exif

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
    - id: codespell
      # Vietnamese text (docs, agent rules, run.ps1) is not English - skip it
      exclude: '(\.md$|^run\.ps1$|^\.claude/)'
      additional_dependencies:
        - tomli

  # Ensure github actions remain safe
  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.30.1
    hooks:
    - id: zizmor
