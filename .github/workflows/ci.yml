name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a run of main: its deploy job may be switching the server
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: Lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          activate-environment: true
          enable-cache: true
          python-version: "3.13"
          cache-dependency-glob: "requirements**.txt"

      - name: Install dependencies
        run: |
          uv pip install -r requirements-dev.txt
          uv pip install -e .

      - name: Ruff
        run: |
          ruff check --output-format=github freqtrade tests scripts
          ruff format --check freqtrade tests scripts

      - name: Tests
        run: |
          pytest --random-order -n auto -q --ignore=tests/exchange_online -p no:cacheprovider

  # A push to main (a merged PR) deploys the commit to the VPS once the tests passed. The server
  # does the checks (deploy/deploy.sh): preflight on the new code, safe moment, restart, verify,
  # rollback. Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (private half of a key whose public half
  # is a forced-command line in the server's authorized_keys) and VPS_KNOWN_HOSTS (ssh-keyscan
  # of the server), see docs/deploy-vps.md. This repository is public: nothing private is
  # printed; the server only answers "deploy <sha>" or "status".
  deploy:
    name: Deploy to the VPS
    needs: tests
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=60 "$VPS_USER@$VPS_HOST" "deploy $SHA"

      - name: Server status
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" status || true
          rm -f ~/.ssh/deploy_key
