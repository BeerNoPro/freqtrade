---
# Signal bot (Binance USDT-M futures, dry-run) - built from this repository's Dockerfile.
#   docker compose up -d --build
# Strategy name: FT_STRATEGY in a .env file next to this file (default below).
# Secrets (Telegram token, API passwords) stay in user_data/config*.json or FREQTRADE__* env vars.
services:
  freqtrade:
    build:
      context: .
      dockerfile: Dockerfile
    image: futures-signal-bot:local
    restart: unless-stopped
    container_name: freqtrade
    volumes:
      - "./user_data:/freqtrade/user_data"
    environment:
      # The API must listen on all interfaces inside the container for the port mapping
      # below to work. The host side stays bound to 127.0.0.1 - reach it via an SSH tunnel.
      FREQTRADE__API_SERVER__LISTEN_IP_ADDRESS: "0.0.0.0"
    ports:
      - "127.0.0.1:8080:8080"
    # --dry-run forces simulated orders whatever the config says. Remove it only when
    # switching to live trading (phase 2) after an explicit decision.
    command: >
      trade
      --dry-run
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.dryrun.sqlite
      --config /freqtrade/user_data/config_futures.json
      --strategy ${FT_STRATEGY:-FuturesSignalStrategy}

  # Records Binance data the public archive does not keep (liquidations, best bid/ask, predicted
  # funding, order book, options) into user_data/research/live - see scripts/research/record_market.py.
  #   docker compose up -d --build recorder
  recorder:
    image: futures-signal-bot:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: market-recorder
    volumes:
      - "./user_data:/freqtrade/user_data"
    working_dir: /freqtrade/scripts/research
    entrypoint: ["python", "record_market.py"]

  # Forward-test runner: writes setups to user_data/research/forward/journal.sqlite before their
  # outcome is known and scores them - see scripts/research/run_forward.py. Needs the private
  # rules in user_data/research (forward_v1.py) and the point-in-time store user_data/research/pit.
  #   docker compose up -d --build forward
  forward:
    image: futures-signal-bot:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: forward-runner
    volumes:
      - "./user_data:/freqtrade/user_data"
    working_dir: /freqtrade/scripts/research
    entrypoint: ["python", "run_forward.py"]
